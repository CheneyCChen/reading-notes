<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="theme-color" content="#f5f5f7"><title>Reading Club</title><link rel="stylesheet" href="assets/site.css"><script defer src="assets/library.js"></script></head>
<body>
<header class="topbar"><a class="brand" href="index.html">Reading Club</a><nav aria-label="资料库"><button class="nav active" data-view="all" aria-pressed="true">全部</button><button class="nav" data-view="starred" aria-pressed="false">收藏</button><button class="nav" data-view="reading" aria-pressed="false">在读</button></nav><a class="source" href="https://github.com/CheneyCChen/reading-notes" aria-label="GitHub 仓库" title="GitHub">↗</a></header>
<main><section class="library" aria-labelledby="view-title"><div class="section-heading"><h1 id="view-title">阅读报告</h1><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" type="search" placeholder="搜索" aria-label="搜索标题、作者或关键词"><kbd>/</kbd></label></div><div class="toolbar"><div class="filters" aria-label="主题筛选"><button class="selected" data-topic="all" aria-pressed="true">全部</button><button data-topic="equilibrium" aria-pressed="false">平衡</button><button data-topic="kinetic" aria-pressed="false">动理学</button><button data-topic="comparison" aria-pressed="false">比较</button></div><select id="sort" aria-label="排序"><option value="recent">最近添加</option><option value="title">标题</option><option value="year">年份</option></select></div><p id="result-count" class="sr-only" aria-live="polite"></p><div id="cards" class="cards"></div><div id="empty" hidden class="empty">暂无报告<button id="reset">重置筛选</button></div><noscript>请启用 JavaScript，或<a href="reports/ai-gx-reading/report.html">直接阅读报告</a>。</noscript></section></main>
</body></html>
