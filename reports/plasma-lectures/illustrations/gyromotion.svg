<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-gyromotion-title pi-gyromotion-desc" class="plasma-figure-svg"><title id="pi-gyromotion-title">回旋运动中的速度与洛伦兹力</title><desc id="pi-gyromotion-desc">正电荷在出纸面均匀磁场中顺时针回旋。轨道右端速度向下，洛伦兹力指向圆心。</desc><defs><marker id="pi-gyromotion-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><circle cx="300" cy="155" r="92" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="300" cy="155" r="4" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="300" y="172" font-size="17" text-anchor="middle">导心</text><circle cx="392" cy="155" r="7" fill="currentColor" stroke="currentColor" stroke-width="2"/><path d="M392,155 L392,225" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-gyromotion-arrow)"/><text x="436" y="211" font-size="19" text-anchor="middle">v⊥</text><path d="M392,155 L326,155" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-gyromotion-arrow)"/><text x="354" y="135" font-size="17" text-anchor="middle">洛伦兹力</text><path d="M300,155 L300,63" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5"/><text x="276" y="105" font-size="19" text-anchor="middle">ρ</text><circle cx="90" cy="80" r="17" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="90" cy="80" r="3" fill="currentColor" stroke="currentColor" stroke-width="2"/><text x="90" y="118" font-size="17" text-anchor="middle">B 出纸面</text><text x="300" y="30" font-size="19" text-anchor="middle">垂直磁场平面：q &gt; 0，顺时针回旋</text><text x="300" y="282" font-size="19" text-anchor="middle">沿 B 的 v∥ 与回旋叠加，形成螺旋轨道</text><text x="300" y="312" font-size="17" text-anchor="middle">q &lt; 0 时回旋方向反转；ρ = v⊥ / |Ω|</text></g></svg>