<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-magnetized-diffusion-title pi-magnetized-diffusion-desc" class="plasma-figure-svg"><title id="pi-magnetized-diffusion-title">碰撞与强磁场如何改变扩散步长</title><desc id="pi-magnetized-diffusion-desc">沿磁场方向每次碰撞之间移动约一个自由程。垂直方向碰撞改变回旋导心约一个回旋半径。两方向扩散系数对碰撞频率依赖相反。</desc><defs><marker id="pi-magnetized-diffusion-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><text x="150" y="32" font-size="19" text-anchor="middle">沿场随机游走</text><text x="450" y="32" font-size="19" text-anchor="middle">强磁化横向导心游走</text><path d="M45,110 L260,110" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-magnetized-diffusion-arrow)"/><text x="150" y="85" font-size="18" text-anchor="middle">B</text><path d="M60,135 L210,135" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-magnetized-diffusion-arrow)"/><path d="M210,170 L110,170" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-magnetized-diffusion-arrow)"/><path d="M110,205 L250,205" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-magnetized-diffusion-arrow)"/><text x="35" y="141" font-size="16" text-anchor="middle">①</text><text x="35" y="176" font-size="16" text-anchor="middle">②</text><text x="35" y="211" font-size="16" text-anchor="middle">③</text><text x="150" y="250" font-size="20" text-anchor="middle">步长 ~ vT / ν</text><circle cx="450" cy="155" r="64" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="482" cy="173" r="64" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="450" cy="155" r="3" fill="currentColor" stroke="currentColor" stroke-width="2"/><circle cx="482" cy="173" r="3" fill="currentColor" stroke="currentColor" stroke-width="2"/><path d="M450,155 L482,173" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-magnetized-diffusion-arrow)"/><text x="450" y="250" font-size="17" text-anchor="middle">导心步长 ~ ρ = vT / |Ω|</text><text x="450" y="75" font-size="17" text-anchor="middle">B 垂直此平面</text><text x="150" y="294" font-size="20" text-anchor="middle">D∥ ~ vT² / ν</text><text x="450" y="294" font-size="20" text-anchor="middle">D⊥ ~ νρ²</text><text x="300" y="323" font-size="17" text-anchor="middle">适用：ν ≪ |Ω|，且观察时间远大于碰撞时间</text></g></svg>