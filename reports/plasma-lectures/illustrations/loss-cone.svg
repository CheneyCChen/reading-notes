<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-loss-cone-title pi-loss-cone-desc" class="plasma-figure-svg"><title id="pi-loss-cone-title">磁镜中面速度空间中的双向损失锥</title><desc id="pi-loss-cone-desc">在磁场最弱处画速度空间截面。靠近平行轴的双锥为可逃逸区域，锥外为反射俘获区域；没有电势或碰撞。</desc><defs><marker id="pi-loss-cone-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><polygon points="300,165 525,60 525,270" fill="var(--soft, #e8e4d9)" stroke="currentColor" stroke-width="2"/><polygon points="300,165 75,60 75,270" fill="var(--soft, #e8e4d9)" stroke="currentColor" stroke-width="2"/><path d="M45,165 L560,165" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-loss-cone-arrow)"/><path d="M300,290 L300,40" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-loss-cone-arrow)"/><text x="562" y="193" font-size="19" text-anchor="middle">v∥</text><text x="300" y="24" font-size="17" text-anchor="middle">v⊥（有符号截面）</text><text x="455" y="153" font-size="19" text-anchor="middle">逃逸</text><text x="140" y="153" font-size="19" text-anchor="middle">逃逸</text><text x="300" y="75" font-size="19" text-anchor="middle">俘获</text><text x="300" y="260" font-size="19" text-anchor="middle">俘获</text><path d="M354,165 A54,54 0 0 0 349,142" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="375" y="133" font-size="17" text-anchor="middle">αLC</text><text x="300" y="315" font-size="21" text-anchor="middle">sin² αLC = Bmin / Bmax</text></g></svg>