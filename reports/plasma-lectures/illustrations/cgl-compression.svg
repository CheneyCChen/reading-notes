<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-cgl-compression-title pi-cgl-compression-desc" class="plasma-figure-svg"><title id="pi-cgl-compression-title">CGL 双绝热的两种压缩检验</title><desc id="pi-cgl-compression-desc">磁场沿磁通管长轴。横向压缩固定长度，使密度与磁场同增、垂直温度升高；平行压缩固定截面，使平行温度随密度平方增长。</desc><defs><marker id="pi-cgl-compression-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><text x="150" y="30" font-size="19" text-anchor="middle">横向压缩</text><text x="450" y="30" font-size="19" text-anchor="middle">平行压缩</text><polygon points="45,65 255,65 255,135 45,135" fill="none" stroke="currentColor" stroke-width="2"/><path d="M53,86.0 L247,86.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><path d="M53,114.0 L247,114.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><polygon points="45,200 255,200 255,235 45,235" fill="none" stroke="currentColor" stroke-width="2"/><path d="M53,210.5 L247,210.5" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><path d="M53,224.5 L247,224.5" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><polygon points="345,65 555,65 555,135 345,135" fill="none" stroke="currentColor" stroke-width="2"/><path d="M353,86.0 L547,86.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><path d="M353,114.0 L547,114.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><polygon points="390,200 510,200 510,270 390,270" fill="none" stroke="currentColor" stroke-width="2"/><path d="M398,221.0 L502,221.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><path d="M398,249.0 L502,249.0" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><text x="150" y="54" font-size="16" text-anchor="middle">B →（沿管轴）</text><text x="450" y="54" font-size="16" text-anchor="middle">B →（沿管轴）</text><path d="M150,145 L150,187" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><path d="M450,145 L450,187" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-cgl-compression-arrow)"/><text x="150" y="262" font-size="17" text-anchor="middle">长度固定：n ∝ B</text><text x="150" y="292" font-size="18" text-anchor="middle">T⊥ ∝ B；T∥ 不变</text><text x="450" y="292" font-size="18" text-anchor="middle">T∥ ∝ n²；T⊥ 不变</text><text x="450" y="320" font-size="17" text-anchor="middle">截面积固定：B 不变</text></g></svg>