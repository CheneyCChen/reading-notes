<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-liouville-shear-title pi-liouville-shear-desc" class="plasma-figure-svg"><title id="pi-liouville-shear-title">Liouville 定理：相空间剪切保持面积</title><desc id="pi-liouville-shear-desc">自由粒子的正则相空间小矩形随时间剪切成平行四边形。两形状底边和高度相同，因此面积相等。</desc><defs><marker id="pi-liouville-shear-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><path d="M40,240 L260,240" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-liouville-shear-arrow)"/><path d="M55,255 L55,50" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-liouville-shear-arrow)"/><text x="260" y="267" font-size="19" text-anchor="middle">q</text><text x="35" y="48" font-size="19" text-anchor="middle">p</text><polygon points="90,190 170,190 170,100 90,100" fill="var(--soft, #e8e4d9)" stroke="currentColor" stroke-width="2"/><text x="132" y="153" font-size="19" text-anchor="middle">S</text><path d="M330,240 L575,240" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-liouville-shear-arrow)"/><path d="M345,255 L345,50" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-liouville-shear-arrow)"/><text x="575" y="267" font-size="19" text-anchor="middle">q</text><text x="325" y="48" font-size="19" text-anchor="middle">p</text><polygon points="400,190 480,190 516,100 436,100" fill="var(--soft, #e8e4d9)" stroke="currentColor" stroke-width="2"/><text x="460" y="153" font-size="19" text-anchor="middle">S</text><path d="M245,140 L320,140" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-liouville-shear-arrow)"/><text x="283" y="113" font-size="16" text-anchor="middle">时间 t</text><text x="300" y="30" font-size="19" text-anchor="middle">自由粒子 Hamilton 流：平移 + 剪切</text><text x="300" y="296" font-size="19" text-anchor="middle">q(t) = q(0) + p(0)t/m，p(t) = p(0)</text><text x="300" y="321" font-size="17" text-anchor="middle">相空间面积守恒；形状不必保持</text></g></svg>