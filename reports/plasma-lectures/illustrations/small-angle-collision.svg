<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="pi-small-angle-collision-title pi-small-angle-collision-desc" class="plasma-figure-svg"><title id="pi-small-angle-collision-title">小角散射的横向与纵向速度增量</title><desc id="pi-small-angle-collision-desc">两体弹性碰撞的相对速度在碰撞前后模长不变。横向增量为一阶角度，纵向增量为负的二阶角度。</desc><defs><marker id="pi-small-angle-collision-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 Z" fill="currentColor"/></marker></defs><g font-family="Georgia, Songti SC, serif" fill="currentColor"><path d="M75,240 L490,240" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-small-angle-collision-arrow)"/><text x="505" y="249" font-size="19" text-anchor="middle">平行方向</text><path d="M100,265 L100,45" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-small-angle-collision-arrow)"/><text x="100" y="30" font-size="19" text-anchor="middle">横向</text><path d="M100,240 L400,240" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-small-angle-collision-arrow)"/><path d="M100,240 L373.93,117.67" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-small-angle-collision-arrow)"/><text x="290" y="218" font-size="19" text-anchor="middle">u</text><text x="260" y="150" font-size="19" text-anchor="middle">u′</text><path d="M400,240 L373.9266820936925,117.67186408212895" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#pi-small-angle-collision-arrow)"/><text x="432" y="170" font-size="19" text-anchor="middle">Δu</text><path d="M373.9266820936925,240 L373.9266820936925,117.67186408212895" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5"/><path d="M160,240 A60,60 0 0 0 155,216" fill="none" stroke="currentColor" stroke-width="2.5"/><text x="183" y="221" font-size="19" text-anchor="middle">θ</text><text x="300" y="290" font-size="19" text-anchor="middle">|u′| = |u|：仅相对速度方向改变</text><text x="300" y="319" font-size="19" text-anchor="middle">Δu⊥ ~ uθ；Δu∥ ~ −uθ²/2</text></g></svg>