name: Reading Club checks
on:
  push:
    branches: [main, 'style/**']
  pull_request:
permissions:
  contents: read
jobs:
  reading-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check content preservation
        run: |
          node --check assets/library.js
          node --check assets/theme.js
          npm run test:content
      - name: Check browser interactions and responsive layouts
        run: |
          python3 -m http.server 8766 > /tmp/reading-club-server.log 2>&1 &
          npm run test:browser
      - name: Retain screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reading-club-screenshots
          path: |
            /tmp/reading-club-*.png
            /tmp/plasma-lecture*.png
          if-no-files-found: ignore
          retention-days: 7
